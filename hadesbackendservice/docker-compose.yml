version: '3.8'

services:
  hades-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hades-backend-service
    ports:
      - "8080:8080"
    environment:
      - HTTP_PORT=8080
      - HTTP_INTERFACE=0.0.0.0
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://host.docker.internal:8000}
      - DATABASE_URL=${DATABASE_URL:-jdbc:postgresql://host.docker.internal:5432/hcl_learning}
      - DATABASE_USER=${DATABASE_USER:-hcl}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-hcl_dev_password}
      - JWT_SECRET=${JWT_SECRET:-hades-super-secret-jwt-signing-key-2026}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
