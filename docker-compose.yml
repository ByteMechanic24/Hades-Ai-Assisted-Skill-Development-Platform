services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: hcl_learning
      POSTGRES_USER: hcl
      POSTGRES_PASSWORD: hcl_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://hcl:hcl_dev_password@postgres:5432/hcl_learning
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    env_file:
      - ./ai-service/.env
    depends_on:
      - postgres
    restart: unless-stopped

  hades-backend:
    build:
      context: ./hadesbackendservice
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - HTTP_PORT=8080
      - HTTP_INTERFACE=0.0.0.0
      - AI_SERVICE_URL=http://ai-service:8000
      - DATABASE_URL=jdbc:postgresql://postgres:5432/hcl_learning
      - DATABASE_USER=hcl
      - DATABASE_PASSWORD=hcl_dev_password
      - JWT_SECRET=hades-super-secret-jwt-signing-key-2026
    depends_on:
      - postgres
      - ai-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - hades-backend
    restart: unless-stopped

volumes:
  pgdata:
